<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced JPG to PDF Converter</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Cropper.js for Image Cropping functionality -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <style>
        .sidebar-panel {
            width: 2in;
            min-width: 2in;
        }
        .thumbnail-wrapper {
            position: relative;
        }
        .thumbnail-wrapper:hover .action-overlay {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-600 mb-2">অ্যাডভান্সড ইমেজ টু পিডিএফ কনভার্টার</h1>
            <p class="text-gray-600">নতুন ফাইল যোগ করুন, ছবি ক্রপ বা ডিলিট করুন এবং সাইজ কমিয়ে কম্প্রেশনসহ PDF তৈরি করুন</p>
        </header>

        <div class="flex flex-col md:flex-row gap-6 items-start">
            
            <!-- Main Content Area: Controls and Workspace -->
            <div class="flex-1 bg-white p-6 rounded-xl shadow-md border border-gray-100 w-full">
                
                <!-- File Input Control -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">ছবি যোগ করুন (আগের ছবিগুলো মুছে যাবে না):</label>
                    <input type="file" id="imageInput" multiple accept="image/jpeg, image/jpg" 
                           class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-dashed border-gray-300 p-4 rounded-lg bg-gray-50">
                </div>

                <!-- Optimization Settings -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                            <span>ছবির কোয়ালিটি (Quality):</span>
                            <span id="qualityVal" class="font-bold text-blue-600">70%</span>
                        </label>
                        <input type="range" id="qualityRange" min="10" max="100" value="70" class="w-full accent-blue-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 flex justify-between">
                            <span>সাইজ স্কেল (Scale):</span>
                            <span id="scaleVal" class="font-bold text-blue-600">80%</span>
                        </label>
                        <input type="range" id="scaleRange" min="20" max="100" value="80" class="w-full accent-blue-600">
                    </div>
                </div>

                <!-- Action Button -->
                <button id="generatePdfBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors text-center cursor-pointer mb-6">
                    কম সাইজের PDF তৈরি করুন
                </button>

                <!-- Workspace / Preview Grid -->
                <h3 class="text-lg font-bold text-gray-700 mb-3 border-b pb-2">আপলোড করা ছবিগুলোর প্রিভিউ:</h3>
                <div id="previewContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    <!-- Dynamic Thumbnails will render here -->
                </div>
            </div>

            <!-- Right Sidebar: 2-inch Counter Display Panel -->
            <div class="sidebar-panel bg-white p-4 rounded-xl shadow-md border-2 border-blue-200 sticky top-4 flex flex-col items-center justify-center text-center self-stretch md:self-start">
                <div class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">মোট ডকুমেন্ট</div>
                <div id="fileCounter" class="text-5xl font-black text-blue-600 my-2">0</div>
                <div class="text-xs text-gray-500 font-medium">টি ফাইল যুক্ত আছে</div>
            </div>

        </div>
    </div>

    <!-- Cropping Modal -->
    <div id="cropModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4 animate-fade-in">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">ছবি ক্রপ/কাটিং করুন</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 text-2xl font-semibold cursor-pointer">&times;</button>
            </div>
            <div class="p-4 overflow-hidden flex-1 bg-gray-900 flex items-center justify-center min-h-[300px] max-h-[60vh]">
                <img id="cropperImage" class="max-w-full max-h-full block">
            </div>
            <div class="p-4 border-t flex justify-end gap-3 bg-gray-50">
                <button id="cancelCropBtn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-md transition-colors cursor-pointer">বাতিল</button>
                <button id="saveCropBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md transition-colors shadow cursor-pointer">কাটা অংশ সেভ করুন</button>
            </div>
        </div>
    </div>

    <script>
        // Array to store operational image data objects: { id, originalDataUrl, currentDataUrl }
        let uploadedImages = [];
        let currentImageIdForCrop = null;
        let cropperInstance = null;

        // Dom Elements
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const fileCounter = document.getElementById('fileCounter');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        
        const qualityRange = document.getElementById('qualityRange');
        const qualityVal = document.getElementById('qualityVal');
        const scaleRange = document.getElementById('scaleRange');
        const scaleVal = document.getElementById('scaleVal');

        const cropModal = document.getElementById('cropModal');
        const cropperImage = document.getElementById('cropperImage');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const saveCropBtn = document.getElementById('saveCropBtn');

        // Dynamic Slider Indicators
        qualityRange.addEventListener('input', (e) => qualityVal.textContent = e.target.value + '%');
        scaleRange.addEventListener('input', (e) => scaleVal.textContent = e.target.value + '%');

        // Append files continuously without clearing previous entries
        imageInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;

            let loadedCount = 0;
            files.forEach(file => {
                if(!file.type.startsWith('image/')) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgObj = {
                        id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                        originalDataUrl: event.target.result,
                        currentDataUrl: event.target.result
                    };
                    uploadedImages.push(imgObj);
                    loadedCount++;

                    if(loadedCount === files.length || uploadedImages.length % 5 === 0 || loadedCount === files.length) {
                        renderWorkspace();
                    }
                };
                reader.readAsDataURL(file);
            });
            
            // Reset input so the same file can be uploaded again if needed
            imageInput.value = '';
        });

        // Main workspace renderer
        function renderWorkspace() {
            previewContainer.innerHTML = '';
            fileCounter.textContent = uploadedImages.length;

            if(uploadedImages.length === 0) {
                previewContainer.innerHTML = '<p class="text-gray-400 text-sm col-span-full py-8 text-center">কোন ছবি আপলোড করা হয়নি।</p>';
                return;
            }

            uploadedImages.forEach((imgObj, index) => {
                const card = document.createElement('div');
                card.className = "thumbnail-wrapper bg-gray-100 rounded-lg overflow-hidden border border-gray-200 shadow-sm flex flex-col group relative";
                
                card.innerHTML = `
                    <div class="aspect-square w-full bg-gray-200 flex items-center justify-center overflow-hidden relative">
                        <img src="${imgObj.currentDataUrl}" class="w-full h-full object-cover">
                        <!-- Action Overlay visible on hover/focus -->
                        <div class="action-overlay absolute inset-0 bg-black/50 opacity-0 flex flex-col items-center justify-center gap-2 transition-opacity duration-200">
                            <button onclick="openCropper('${imgObj.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-md flex items-center gap-1 shadow cursor-pointer w-24 justify-center">✂ ক্রপ করুন</button>
                            <button onclick="deleteImage('${imgObj.id}')" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-md flex items-center gap-1 shadow cursor-pointer w-24 justify-center">🗑 ডিলিট</button>
                        </div>
                    </div>
                    <div class="p-2 text-center text-xs font-bold text-gray-500 bg-white border-t border-gray-100">
                        ছবি নম্বর: ${index + 1}
                    </div>
                `;
                previewContainer.appendChild(card);
            });
        }

        // Delete Individual Image
        window.deleteImage = function(id) {
            uploadedImages = uploadedImages.filter(item => item.id !== id);
            renderWorkspace();
        };

        // Open Cropper Modal
        window.openCropper = function(id) {
            const target = uploadedImages.find(item => item.id === id);
            if(!target) return;

            currentImageIdForCrop = id;
            cropperImage.src = target.originalDataUrl;
            cropModal.classList.remove('hidden');

            // Initialize Cropper Instance after visual binding
            if(cropperInstance) cropperInstance.destroy();
            
            // Brief timeout ensures rendering transitions don't break dimensions
            setTimeout(() => {
                cropperInstance = new Cropper(cropperImage, {
                    viewMode: 1,
                    autoCropArea: 0.8,
                    responsive: true,
                    restore: false
                });
            }, 50);
        };

        // Close Cropper Dialog
        function closeCropModal() {
            cropModal.classList.add('hidden');
            if(cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            currentImageIdForCrop = null;
        }

        closeModalBtn.addEventListener('click', closeCropModal);
        cancelCropBtn.addEventListener('click', closeCropModal);

        // Save Cropped canvas back into state registry
        saveCropBtn.addEventListener('click', function() {
            if(!cropperInstance || !currentImageIdForCrop) return;

            // Extract high quality canvas data from selection area
            const canvas = cropperInstance.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            if(canvas) {
                const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                const targetIndex = uploadedImages.findIndex(item => item.id === currentImageIdForCrop);
                if(targetIndex !== -1) {
                    uploadedImages[targetIndex].currentDataUrl = croppedDataUrl;
                    renderWorkspace();
                }
            }
            closeCropModal();
        });

        // Generate Highly Compressed PDF Architecture
        generatePdfBtn.addEventListener('click', async function() {
            if(uploadedImages.length === 0) {
                alert('অনুগ্রহ করে প্রথমে এক বা একাধিক ছবি যুক্ত করুন!');
                return;
            }

            generatePdfBtn.disabled = true;
            generatePdfBtn.textContent = 'PDF তৈরি হচ্ছে, দয়া করে অপেক্ষা করুন...';

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            const targetQuality = parseFloat(qualityRange.value) / 100;
            const targetScale = parseFloat(scaleRange.value) / 100;
            
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            for(let i = 0; i < uploadedImages.length; i++) {
                if(i > 0) doc.addPage();

                const imgData = uploadedImages[i].currentDataUrl;
                
                // Synchronously process resizing on standard image canvas to obey user compression directives
                await new Promise((resolve) => {
                    const tempImg = new Image();
                    tempImg.src = imgData;
                    tempImg.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Dimensions scaling calculation
                        canvas.width = tempImg.width * targetScale;
                        canvas.height = tempImg.height * targetScale;
                        
                        ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
                        
                        // Convert to highly compressed jpeg blob data url
                        const compressedUrl = canvas.toDataURL('image/jpeg', targetQuality);

                        // Layout fitting logic inside standard A4 frame boundary limits
                        let printWidth = pageWidth;
                        let printHeight = (canvas.height * pageWidth) / canvas.width;

                        if (printHeight > pageHeight) {
                            printHeight = pageHeight;
                            printWidth = (canvas.width * pageHeight) / canvas.height;
                        }

                        const xOffset = (pageWidth - printWidth) / 2;
                        const yOffset = (pageHeight - printHeight) / 2;

                        doc.addImage(compressedUrl, 'JPEG', xOffset, yOffset, printWidth, printHeight, undefined, 'FAST');
                        resolve();
                    };
                });
            }

            doc.save(`Compressed_Document_${Date.now()}.pdf`);
            generatePdfBtn.disabled = false;
            generatePdfBtn.textContent = 'কম সাইজের PDF তৈরি করুন';
        });
    </script>
</body>
</html>
