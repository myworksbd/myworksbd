<style>
:root{--ink:#1c2233;--mut:#5d6579;--line:#e3e6ee;--bg:#C2D7EC;--brand:#2f4fd8}
*{box-sizing:border-box}
body{margin:0;background:#C2D7EC;color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri","Nirmala UI",system-ui,sans-serif;line-height:1.55}
.promo{background:linear-gradient(90deg,#1d4ed8,#3730a3);color:#fff;text-align:center;padding:10px 14px;font-weight:600;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.promo a,.btn-ext{background:#f5a623;color:#1c2233;padding:5px 14px;border-radius:99px;text-decoration:none;font-weight:700;font-size:13px}
header.hero{text-align:center;padding:44px 16px 18px}
h1{margin:0;font-size:clamp(26px,5vw,40px);letter-spacing:-.5px}
.hero p{max-width:620px;margin:10px auto 0;color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:18px 16px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:0 16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:18px;text-align:left;font:inherit;color:inherit}
.card .ic{font-size:30px;line-height:1}
.card .ic img{height:44px;width:auto;display:block}
.card h3{margin:10px 0 4px;font-size:17px}
.card p{margin:0;font-size:13.5px;color:var(--mut)}
.card.live{cursor:pointer}
.card.live:hover{border-color:var(--c);box-shadow:0 6px 18px rgba(20,30,70,.1)}
.card.soon{opacity:.62}
.tag{position:absolute;top:12px;right:12px;font-size:11.5px;padding:2px 9px;border-radius:99px;background:#eceef5;color:var(--mut)}
.live .tag{background:#dff5e6;color:#17693a}
[data-cat=organize]{--c:#e5533d}[data-cat=optimize]{--c:#2e9b5f}[data-cat=convert]{--c:#3b6df0}
[data-cat=edit]{--c:#8a4fd6}[data-cat=security]{--c:#d98a00}[data-cat=ai]{--c:#0f9aa8}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,92vw);box-shadow:0 20px 60px rgba(10,20,50,.35)}
dialog::backdrop{background:rgba(15,20,40,.55)}
.dh{padding:20px 22px 6px}.dh h2{margin:0;font-size:22px}.dh p{margin:4px 0 0;color:var(--mut);font-size:14px}
.db{padding:12px 22px 22px}
.pick{display:block;border:2px dashed #b9c0d4;border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:var(--mut);background:#fafbfe}
.pick:hover{border-color:var(--brand);color:var(--brand)}
.pick input{display:none}
ul#fl{list-style:none;margin:10px 0;padding:0}
ul#fl li{display:flex;gap:6px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14px}
ul#fl li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul#fl small{color:var(--mut)}
ul#fl button{border:0;background:#eef0f7;border-radius:6px;width:28px;height:28px;cursor:pointer}
#op label{display:block;margin:10px 0 0;font-size:14px;font-weight:600}
#op input[type=text],#op select{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid #c8cddd;border-radius:8px;font:inherit}
#op label.ck{font-weight:400;display:flex;gap:8px;align-items:center}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:9px;border:0;font:inherit;font-weight:700;cursor:pointer}
#go{background:var(--brand);color:#fff}#go:disabled{opacity:.5;cursor:wait}
#cl{background:#eef0f7;color:var(--ink);flex:0 0 90px!important}
#st{margin-top:12px;font-size:14px;border-radius:8px}
#st.err{color:#b3261e;background:#fdecea;padding:10px}
#st.ok{color:#17693a;background:#e8f7ee;padding:10px}
#st.ok .btn-ext{display:inline-block;margin-top:6px}
#ifd{width:min(1120px,96vw);height:92vh;overflow:hidden}
#ifd[open]{display:flex;flex-direction:column}
.ifh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
.ifh button{border:0;background:#eef0f7;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
#ifr{flex:1;width:100%;border:0}
.flogo{display:inline-block;margin-bottom:6px}.flogo img{height:36px;width:auto;display:block}
.hlogo{display:inline-block;margin-bottom:8px}.hlogo img{height:60px;width:auto;display:block}
footer{text-align:center;color:var(--mut);font-size:13px;padding:22px;border-top:1px solid var(--line);background:#fff}

const CATS = {all:'সব টুল',organize:'Organize PDF',optimize:'Optimize PDF',convert:'Convert PDF',edit:'Edit PDF',security:'PDF Security',ai:'PDF Intelligence'};

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sz = n => n > 1048576 ? (n/1048576).toFixed(2)+' MB' : Math.round(n/1024)+' KB';
let cat = 'all', cur = null, files = [];

function drawTabs(){
  $('#tabs').innerHTML = Object.entries(CATS).map(([k,v]) => `<button data-k="${k}" class="${k==cat?'on':''}">${v}</button>`).join('');
}
function drawGrid(){
  $('#grid').innerHTML = T.filter(t => cat=='all' || t[4]==cat).map(t =>
    `<${t[5]?'button':'div'} class="card ${t[5]?'live':'soon'}" data-cat="${t[4]}" ${t[5]?`data-id="${t[0]}"`:'aria-disabled="true"'}>
      <span class="tag">${t[5]?'চালু':'শীঘ্রই আসছে'}</span><div class="ic">${t[1]}</div><h3>${t[2]}</h3><p>${t[3]}</p>
    </${t[5]?'button':'div'}>`).join('');
}
$('#tabs').onclick = e => { const b = e.target.closest('[data-k]'); if(b){ cat = b.dataset.k; drawTabs(); drawGrid(); } };
$('#grid').onclick = e => { const c = e.target.closest('[data-id]'); if(c) openTool(c.dataset.id); };

const brandU = w => Math.min(2.2, Math.max(.7, w/595));
const brandH = w => Math.round(26*brandU(w));

// y0 থেকে উপরের দিকে ফুটার আঁকে: বামে ছোট লোগো, ডানে ওয়েবসাইটের ঠিকানা। পুরো ফুটারে ক্লিক করলে ওয়েবসাইটে যাবে
function brandDraw(doc, page, A, w, x0, y0){
  const u = brandU(w), h = brandH(w), rgb = PDFLib.rgb, blue = rgb(.18,.31,.85);
  page.drawRectangle({x:x0, y:y0, width:w, height:h, color:rgb(1,1,1)});
  page.drawLine({start:{x:x0+w*.06, y:y0+h-.5*u}, end:{x:x0+w*.94, y:y0+h-.5*u}, thickness:.6*u, color:rgb(.84,.86,.92)});
  const fs = 9.5*u, lh = 13*u, lw = lh*BRAND_AR, gap = 6*u, tw = A.font.widthOfTextAtSize(BRAND_TXT, fs);
  const sx = x0+(w-(lw+gap+tw))/2, ly = y0+(h-lh)/2-.5*u;
  page.drawImage(A.logo, {x:sx, y:ly, width:lw, height:lh});
  const tx = sx+lw+gap, ty = ly+(lh-fs*.72)/2;
  page.drawText(BRAND_TXT, {x:tx, y:ty, size:fs, font:A.font, color:blue});
  page.drawLine({start:{x:tx, y:ty-1.6*u}, end:{x:tx+tw, y:ty-1.6*u}, thickness:.6*u, color:blue});
  const ctx = doc.context;
  const an = ctx.register(ctx.obj({Type:'Annot', Subtype:'Link', Rect:[x0, y0, x0+w, y0+h], Border:[0,0,0], A:{Type:'Action', S:'URI', URI:PDFLib.PDFString.of(BRAND_URL)}}));
  const ex = page.node.Annots(); if(ex) ex.push(an); else page.node.set(PDFLib.PDFName.of('Annots'), ctx.obj([an]));
}
// আগে থেকে থাকা পেজের নিচে জায়গা বাড়িয়ে ফুটার বসায় (লেখা/ছবি ঢাকে না)
function brandExisting(doc, page, A){
  if(page.getRotation().angle % 360) return;
  const mb = page.getMediaBox(), h = brandH(mb.width);
  page.setMediaBox(mb.x, mb.y-h, mb.width, mb.height+h);
  if(page.node.CropBox()) page.setCropBox(mb.x, mb.y-h, mb.width, mb.height+h);
  brandDraw(doc, page, A, mb.width, mb.x, mb.y-h);
}
async function brandAll(doc){ if(!BRAND_ON) return; const A = await brandAssets(doc); doc.getPages().forEach(p => brandExisting(doc, p, A)); }

const track = (n, p) => { try { gtag('event', n, p); } catch(e){} };
function msg(t, cls){ const s = $('#st'); s.className = cls||''; s.innerHTML = t; }
function done(extra){
  track('tool_success', {tool_name: cur});
  msg(`🎉 সম্পন্ন! ফাইল ডাউনলোড হয়েছে। ${extra||''}<br><small>💡 সরকারি-বেসরকারি চাকরির ফর্ম ১-ক্লিকে পূরণ করতে আমাদের ক্রোম এক্সটেনশন ব্যবহার করুন:</small><br><a class="btn-ext" href="${CHROME_URL}" target="_blank" rel="noopener">Chrome-এ যুক্ত করুন</a>`, 'ok');
}
function dl(data, name, type){
  const b = data instanceof Blob ? data : new Blob([data], {type: type||'application/pdf'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const base = f => f.name.replace(/\.[^.]+$/, '');
function ranges(s, n){
  s = s.trim();
  if(!s) return [...Array(n).keys()].map(i => [i]);
  return s.split(',').map(p => {
    const m = p.trim().match(/^(\d+)(?:-(\d+))?$/);
    if(!m) throw Error('রেঞ্জ ঠিক নেই: "'+p.trim()+'"');
    const a = +m[1], b = +(m[2]||m[1]);
    if(a<1 || b>n || a>b) throw Error(`"${p.trim()}" সীমার বাইরে (মোট ${n} পেজ)`);
    return Array.from({length:b-a+1}, (_, i) => a-1+i);
  });
}
async function renderPages(file, scale, quality, onPage){
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = await PDFLib.PDFDocument.create(), A = BRAND_ON ? await brandAssets(out) : null;
  for(let i=1; i<=pdf.numPages; i++){
    onPage(i, pdf.numPages);
    const pg = await pdf.getPage(i), b = pg.getViewport({scale:1}), v = pg.getViewport({scale});
    const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x, viewport:v}).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    const im = await out.embedJpg(await blob.arrayBuffer());
    const bh = A ? brandH(b.width) : 0, pgo = out.addPage([b.width, b.height+bh]); pgo.drawImage(im, {x:0, y:bh, width:b.width, height:b.height}); if(A) brandDraw(out, pgo, A, b.width, 0, 0);
    c.width = c.height = 0;
  }
  return out.save();
}

// টেক্সট আইটেম থেকে অনুচ্ছেদ ও টেবিল অনুমান করে Word উপাদান বানায়
function pageToDocx(items){
  const F = 'Nirmala UI', W = [];
  const tr = (t, s, b) => new docx.TextRun({text: t.replace(/\s+/g,' ').trim(), size: s, bold: !!b, font: F});
  const para = (t, h = 11) => new docx.Paragraph({spacing:{after:120}, children:[tr(t, Math.max(18, Math.min(44, Math.round(h*2))), h >= 14)]});
  const its = items.filter(it => 'str' in it && it.str.trim())
    .map(it => ({t:it.str, x:it.transform[4], y:it.transform[5], w:it.width, h:Math.abs(it.height) || 10}))
    .sort((a,b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for(const it of its){
    const L = lines[lines.length-1];
    if(L && Math.abs(it.y - L.y) < it.h*.5) L.items.push(it); else lines.push({y:it.y, h:it.h, items:[it]});
  }
  for(const L of lines){
    L.items.sort((a,b) => a.x - b.x); L.cells = []; let c = null;
    for(const it of L.items){
      const gap = c ? it.x - c.x2 : 0;
      if(c && gap <= Math.max(L.h, 10)){ c.t += (gap > L.h*.15 && !/\s$/.test(c.t) && !/^\s/.test(it.t) ? ' ' : '') + it.t; c.x2 = Math.max(c.x2, it.x + it.w); }
      else { c = {x:it.x, x2:it.x + it.w, t:it.t}; L.cells.push(c); }
    }
  }
  let pt = null, ph = 11, pv = null, tb = null;
  const flushP = () => { if(pt){ W.push(para(pt, ph)); pt = null; } };
  const flushT = () => {
    if(!tb) return; const rows = tb.rows; tb = null;
    const xs = rows.flat().map(c => c.x).sort((a,b) => a-b), cols = [];
    xs.forEach(x => { if(!cols.length || x - cols[cols.length-1] > 8) cols.push(x); });
    if(rows.length < 2 || cols.length < 2){ rows.forEach(r => W.push(para(r.map(c => c.t).join('    ')))); return; }
    const idx = x => { let b = 0; cols.forEach((c,i) => { if(Math.abs(c-x) < Math.abs(cols[b]-x)) b = i; }); return b; };
    const grid = rows.map(r => { const a = Array(cols.length).fill(''); r.forEach(c => { const j = idx(c.x); a[j] = (a[j] ? a[j]+' ' : '') + c.t; }); return a; });
    const sp = cols.slice(0,-1).map((c,i) => cols[i+1] - c); sp.push(sp.reduce((a,b) => a+b, 0) / sp.length);
    const sum = sp.reduce((a,b) => a+b, 0), wd = sp.map(v => Math.max(600, Math.round(v/sum*9000)));
    W.push(new docx.Table({
      width:{size:9000, type:docx.WidthType.DXA}, columnWidths:wd, layout:docx.TableLayoutType.FIXED,
      rows: grid.map(r => new docx.TableRow({children: r.map((t,j) => new docx.TableCell({width:{size:wd[j], type:docx.WidthType.DXA}, children:[new docx.Paragraph({children:[tr(t, 20)]})]}))}))
    }));
    W.push(new docx.Paragraph({children:[]}));
  };
  for(const L of lines){
    const gap = pv ? pv.y - L.y : 999;
    if(L.cells.length >= 2){
      const row = L.cells.map(c => ({x:c.x, t:c.t}));
      if(tb && gap < pv.h*3) tb.rows.push(row); else { flushP(); flushT(); tb = {rows:[row]}; }
    } else {
      const c = L.cells[0], last = tb && tb.rows[tb.rows.length-1], k = last && last.find(k => Math.abs(k.x - c.x) < 8);
      if(k && gap < L.h*1.8) k.t += ' ' + c.t;
      else {
        flushT();
        if(pt && gap > 0 && gap < pv.h*1.8 && Math.abs(L.h - ph) < 1.5) pt += ' ' + c.t; else { flushP(); pt = c.t; ph = L.h; }
      }
    }
    pv = L;
  }
  flushT(); flushP();
  return W;
}

// ---------- চালু ৪টি টুল ----------
const H = {
  merge: {multi:1, btn:'PDF জুড়ুন', min:2, need:'জুড়তে অন্তত ২টি PDF বেছে নিন।', opts:'',
    async run(){
      const out = await PDFLib.PDFDocument.create();
      for(const [i,f] of files.entries()){
        msg(`ফাইল ${i+1}/${files.length} যুক্ত হচ্ছে…`);
        const d = await PDFLib.PDFDocument.load(await f.arrayBuffer());
        (await out.copyPages(d, d.getPageIndices())).forEach(p => out.addPage(p));
      }
      await brandAll(out); const bytes = await out.save(); dl(bytes, 'merged.pdf'); done(`মোট সাইজ: ${sz(bytes.length)}`);
    }},
  split: {btn:'PDF ভাগ করুন', need:'একটি PDF বেছে নিন।',
    opts:`<label>পেজ রেঞ্জ (যেমন 1-3, 5, 8-10)<input type="text" id="rg" placeholder="খালি রাখলে প্রতি পেজ আলাদা ফাইল হবে"></label>
          <label class="ck"><input type="checkbox" id="one"> সব রেঞ্জ একটি PDF ফাইলে রাখুন</label>`,
    async run(){
      const src = await PDFLib.PDFDocument.load(await files[0].arrayBuffer());
      const g = ranges($('#rg').value, src.getPageCount());
      const mk = async idx => { const d = await PDFLib.PDFDocument.create(); (await d.copyPages(src, idx)).forEach(p => d.addPage(p)); await brandAll(d); return d.save(); };
      if($('#one').checked || g.length==1){ dl(await mk(g.flat()), base(files[0])+'-split.pdf'); done(); }
      else {
        const z = new JSZip();
        for(let i=0; i<g.length; i++){ msg(`অংশ ${i+1}/${g.length} তৈরি হচ্ছে…`); z.file(`part-${i+1}.pdf`, await mk(g[i])); }
        dl(await z.generateAsync({type:'blob'}), base(files[0])+'-split.zip'); done(`${g.length}টি PDF ZIP ফাইলে।`);
      }
    }},
  compress: {btn:'PDF কমপ্রেস করুন', need:'একটি PDF বেছে নিন।',
    opts:`<label>কমপ্রেশন লেভেল<select id="lv">
            <option value="high">বেশি কমপ্রেশন (সাইজ কম, মান কম)</option>
            <option value="mid" selected>সুষম (প্রস্তাবিত)</option>
            <option value="low">কম কমপ্রেশন (মান ভালো)</option></select></label>
          <p style="font-size:13px;color:#5d6579;margin:10px 0 0">দ্রষ্টব্য: প্রতিটি পেজ ছবিতে রূপান্তর হয়, তাই কমপ্রেসড PDF-এর টেক্সট সিলেক্ট বা সার্চ করা যাবে না।</p>`,
    async run(){
      const lv = {high:[1.2,.5], mid:[1.6,.7], low:[2,.85]}[$('#lv').value];
      const bytes = await renderPages(files[0], lv[0], lv[1], (i,n) => msg(`পেজ ${i}/${n} প্রসেস হচ্ছে…`));
      dl(bytes, base(files[0])+'-compressed.pdf');
      done(`${sz(files[0].size)} → ${sz(bytes.length)}` + (bytes.length >= files[0].size ? '<br>সাইজ কমেনি, ফাইলটি হয়তো আগেই অপ্টিমাইজড। অন্য লেভেল চেষ্টা করুন।' : ''));
    }},
  pdf_word: {btn:'Word-এ রূপান্তর করুন', need:'একটি PDF বেছে নিন।',
    opts:`<label>স্ক্যান করা PDF হলে ভাষা (OCR)<select id="ol"><option value="ben+eng">বাংলা + English</option><option value="eng">শুধু English</option></select></label>
          <p style="font-size:13px;color:#5d6579;margin:10px 0 0">সাধারণ PDF-এর টেক্সট ও টেবিল (অনুমান করে) রূপান্তর হয়, ছবি বাদ যায়। টেক্সট না পেলে নিজে থেকে OCR চলবে। প্রথমবার ভাষার ডেটা ডাউনলোডে সময় লাগবে, আর প্রতি পেজে ১০-৩০ সেকেন্ড লাগতে পারে। OCR চললে টেবিল আসবে না, শুধু লেখা আসবে। বাংলা OCR-এর ফল মিলিয়ে দেখে নিন।</p>`,
    async run(){
      const pdf = await pdfjsLib.getDocument({data: await files[0].arrayBuffer()}).promise;
      const ch = []; let any = 0;
      for(let i=1; i<=pdf.numPages; i++){
        msg(`পেজ ${i}/${pdf.numPages} পড়া হচ্ছে…`);
        const tc = await (await pdf.getPage(i)).getTextContent();
        const els = pageToDocx(tc.items);
        if(els.length){ if(any) ch.push(new docx.Paragraph({children:[new docx.PageBreak()]})); any = 1; ch.push(...els); }
      }
      if(!any){
        let pg = 1;
        msg('এই PDF-এ সিলেক্টযোগ্য টেক্সট নেই। OCR শুরু হচ্ছে, প্রথমবার একটু সময় লাগবে…');
        const wk = await Tesseract.createWorker($('#ol').value, 1, {logger: m => { if(m.status) msg(`OCR: পেজ ${pg}/${pdf.numPages} · ${m.status}${m.progress ? ' ' + Math.round(m.progress*100) + '%' : ''}`); }});
        for(let i=1; i<=pdf.numPages; i++){
          pg = i;
          const page = await pdf.getPage(i), v = page.getViewport({scale:3});
          const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height);
          await page.render({canvasContext:x, viewport:v}).promise;
          const {data:{text}} = await wk.recognize(c);
          text.split(/\n\s*\n/).map(t => t.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean).forEach((t,k) => {
            any = 1; ch.push(new docx.Paragraph({pageBreakBefore: i>1 && k==0, spacing:{after:120}, children:[new docx.TextRun({text:t, size:22, font:'Nirmala UI'})]}));
          });
          c.width = c.height = 0;
        }
        await wk.terminate();
        if(!any) throw Error('OCR-এও কোনো লেখা পাওয়া যায়নি। স্ক্যানের মান বা ভাষা বদলে দেখুন।');
      }
      dl(await docx.Packer.toBlob(new docx.Document({sections:[{children:ch}]})), base(files[0])+'.docx'); done();
    }}
};
